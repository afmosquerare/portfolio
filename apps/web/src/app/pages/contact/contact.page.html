<section class="max-w-2xl mx-auto">
  <header class="mb-8">
    <h1 class="text-7xl md:text-8xl font-extrabold tracking-tighter text-base-content mb-6 leading-none">
      Contact
    </h1>
    <p class="text-base-content/60 text-xl font-light leading-relaxed">
      Have a project in mind, need support, or an interesting job opportunity? Fill out the
      form or write me directly at <a href="mailto:andresm.rengifo@gmail.com"
        class="text-primary hover:underline font-medium">andresm.rengifo&#64;gmail.com</a>.
    </p>
  </header>

  <form class="flex flex-col gap-6">
    <div class="form-control w-full">
      <label class="label px-0 pt-0 pb-1">
        <span class="label-text text-base-content/80 font-medium tracking-wide">Name</span>
      </label>
      <input type="text" placeholder="John Doe"
        class="input input-bordered bg-base-200/30 w-full rounded-xl focus:border-primary transition-colors h-12" />
    </div>

    <div class="form-control w-full">
      <label class="label px-0 pt-0 pb-1">
        <span class="label-text text-base-content/80 font-medium tracking-wide">Email</span>
      </label>
      <input type="email" placeholder="john@example.com"
        class="input input-bordered bg-base-200/30 w-full rounded-xl focus:border-primary transition-colors h-12" />
    </div>

    <div class="form-control w-full">
      <label class="label px-0 pt-0 pb-1">
        <span class="label-text text-base-content/80 font-medium tracking-wide">Message</span>
      </label>
      <textarea
        class="textarea textarea-bordered bg-base-200/30 h-40 w-full resize-none rounded-xl focus:border-primary transition-colors text-base"
        placeholder="Describe your project or inquiry here..."></textarea>
    </div>

    <button type="button"
      class="btn btn-primary w-full text-lg font-bold rounded-full text-primary-content shadow-lg shadow-primary/20 hover:scale-[1.02] transition-transform h-14 mt-4">
      Send Message
      <span class="icon-[lucide--send] ml-2 text-xl"></span>
    </button>
  </form>
</section>
