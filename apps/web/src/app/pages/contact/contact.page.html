<section class="max-w-2xl mx-auto">
  <header class="mb-8">
    <h1 class="text-7xl md:text-8xl font-extrabold tracking-tighter text-base-content mb-6 leading-none">
      {{ langService.t().CONTACT_TITLE }}
    </h1>
    <p class="text-base-content/60 text-xl font-light leading-relaxed">
      {{ langService.t().CONTACT_SUBTITLE }} <a (click)="openEmail($event)"
        class="text-primary hover:underline font-medium cursor-pointer">{{ langService.t().CONTACT_EMAIL_LINK }}</a>
    </p>
  </header>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <div class="absolute left-[-9999px] top-[-9999px]" aria-hidden="true">
      <label for="website_url">Website</label>
      <input type="text" id="website_url" formControlName="website_url" tabindex="-1" autocomplete="off" />
    </div>



    <div class="form-control w-full">
      <label class="label px-0 pt-0 pb-1">
        <span class="label-text text-base-content/80 font-medium tracking-wide">{{ langService.t().FORM_NAME }}</span>
      </label>
      <input type="text" formControlName="name" [placeholder]="langService.t().FORM_NAME_PLACEHOLDER"
        class="input input-bordered bg-base-200/30 w-full rounded-xl focus:border-primary transition-colors h-12"
        [class.input-error]="isValidField('name')" />
      <error-message [control]="contactForm.controls.name" />
    </div>

    <div class="form-control w-full">
      <label class="label px-0 pt-0 pb-1">
        <span class="label-text text-base-content/80 font-medium tracking-wide">{{ langService.t().FORM_EMAIL }}</span>
      </label>
      <input type="email" formControlName="email" [placeholder]="langService.t().FORM_EMAIL_PLACEHOLDER"
        class="input input-bordered bg-base-200/30 w-full rounded-xl focus:border-primary transition-colors h-12"
        [class.input-error]="isValidField('email')" />
      <error-message [control]="contactForm.controls.email" />
    </div>

    <div class="form-control w-full">
      <label class="label px-0 pt-0 pb-1">
        <span class="label-text text-base-content/80 font-medium tracking-wide">{{ langService.t().FORM_MESSAGE
          }}</span>
      </label>
      <textarea formControlName="body"
        class="textarea textarea-bordered bg-base-200/30 h-40 w-full resize-none rounded-xl focus:border-primary transition-colors text-base"
        [class.textarea-error]="isValidField('body')"
        [placeholder]="langService.t().FORM_MESSAGE_PLACEHOLDER"></textarea>
      <error-message [control]="contactForm.controls.body" />
    </div>

    <button type="submit" [disabled]="isSubmitting()" class="btn btn-primary w-full ">
      @if (isSubmitting()) {
      <span class="loading loading-spinner"></span>
      <span>{{ langService.t().FORM_SENDING }}</span>
      } @else {
      <span>{{ langService.t().FORM_SEND }}</span>
      <span class="icon-[lucide--send] ml-2 text-xl"></span>
      }
    </button>
  </form>
</section>
