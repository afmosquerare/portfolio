<section class="mb-8">
  <h1 class="text-7xl md:text-8xl font-extrabold tracking-tighter text-base-content mb-6 leading-none">
    {{ langService.t().PROJECTS_TITLE }}
  </h1>
  <p class="text-base-content/60 text-lg font-light">
    {{ langService.t().PROJECTS_SUBTITLE }}
  </p>
</section>

<section class="hidden md:flex flex-wrap items-center gap-6 mb-8">
  <app-view-toggle [(view)]="viewMode" />
</section>

<div [class.grid]="viewMode() === 'grid'" [class.grid-cols-1]="true" [class.md:grid-cols-2]="viewMode() === 'grid'"
  [class.gap-x-12]="true" [class.gap-y-16]="viewMode() === 'grid'" [class.flex]="viewMode() === 'list'"
  [class.flex-col]="viewMode() === 'list'" [class.gap-y-10]="viewMode() === 'list'">
  
  @if (projectsResource.isLoading()) {
    <div class="col-span-full py-20 text-center">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  } @else if (projectsResource.value(); as projects) {
    @for (project of projects; track project.id) {
      @if (project.isVisible) {
        <p-project-card [view]="viewMode()" [project]="project" />
      }
    } @empty {
      <div class="col-span-full py-20 text-center text-base-content/50">
        {{ langService.t().NO_PROJECTS }}
      </div>
    }
  }
</div>
