<section class="mb-8">
  <h1 class="text-7xl md:text-8xl font-extrabold tracking-tighter text-base-content mb-6 leading-none">
    Projects
  </h1>
  <p class="text-base-content/60 text-lg font-light">
    Things I've built, broken, and fixed at 2am.
  </p>
</section>

<section class="hidden md:flex flex-wrap items-center gap-6 mb-8">
  <app-view-toggle [(view)]="viewMode" />
</section>

<div [class.grid]="viewMode() === 'grid'" [class.grid-cols-1]="true" [class.md:grid-cols-2]="viewMode() === 'grid'"
  [class.gap-x-12]="true" [class.gap-y-16]="viewMode() === 'grid'" [class.flex]="viewMode() === 'list'"
  [class.flex-col]="viewMode() === 'list'" [class.gap-y-10]="viewMode() === 'list'">
  <p-project-card [view]="viewMode()" />
  <p-project-card [view]="viewMode()" />
  <p-project-card [view]="viewMode()" />
  <p-project-card [view]="viewMode()" />
</div>
