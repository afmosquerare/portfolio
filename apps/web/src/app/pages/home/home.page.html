<app-language-toggle />
<section class="relative isolate overflow-hidden min-h-screen max-w-6xl mx-auto px-6 md:px-10 py-24 flex flex-col justify-center">

  <svg class="pointer-events-none absolute right-[-22rem] top-1/2 -translate-y-1/2 w-[1200px] h-[1200px] opacity-[0.22] hidden md:block -z-10" viewBox="0 0 1200 1200" fill="none" aria-hidden="true">
    <circle cx="600" cy="600" r="560" stroke="var(--color-primary)" stroke-width="2" />
    <circle cx="600" cy="600" r="380" stroke="var(--color-primary)" stroke-width="1" />
  </svg>

  <div class="relative z-10">
    <h1 #heroTitle class="font-display uppercase break-words text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-bold tracking-tight leading-[0.95] mb-8">
      {{ langService.t().HOME_TITLE }}
    </h1>

    <p #heroSubtitle class="max-w-xl text-xl md:text-2xl leading-snug mb-10" [innerHTML]="langService.t().HOME_SUBTITLE">
    </p>

    <div class="flex flex-col sm:flex-row gap-4 sm:gap-6">
      <button #heroButton routerLink="/projects" class="btn btn-primary">
        {{ langService.t().HOME_BTN_WORK }}
        <span class="icon-[lucide--arrow-right]"></span>
      </button>
      <button #heroButton routerLink="/contact" class="btn btn-outline">
        {{ langService.t().HOME_BTN_CONTACT }}
      </button>
    </div>
  </div>
</section>
