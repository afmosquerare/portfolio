<main class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
  <h1 #heroTitle class="text-7xl md:text-8xl font-semibold tracking-tighter mb-6">
    Andrés Rengifo
  </h1>

  <p #heroSubtitle class="max-w-4xl text-2xl md:text-[30px] leading-tight mb-12">
    A full-stack developer focusing in
    <span class="text-angular font-bold">Angular</span>,
    <span class="text-dotnet font-bold">.NET Core</span>, &
    <span class="text-[#bec2ff] font-bold">Scalable Architecture</span>.
  </p>

  <div class="flex flex-col sm:flex-row gap-4 items-center">
    <button #heroButton routerLink="/projects" class="btn btn-primary  font-bold text-lg hover:scale-102">
      View My Work
      <span class="icon-[lucide--arrow-right]"></span>
    </button>
    <button #heroButton routerLink="/contact" class="btn btn-outline font-bold text-lg hover:bg-white/5">
      Contact Me
    </button>
  </div>
</main>
