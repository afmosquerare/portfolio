<div class="min-h-screen flex items-center justify-center bg-base-100 relative overflow-hidden px-4">

  <div class="card w-full max-w-md bg-base-200/60 border border-white/5 z-10">
    <div class="card-body p-8 sm:p-10">
      <div class="flex flex-col items-center mb-8">
        <h2 class="text-3xl font-bold text-white">Welcome back</h2>
        <p class="text-base-content/60 mt-2">Sign in to your panel</p>
      </div>
      <form (submit)="login($event)" class="flex flex-col gap-5">
        <div class="form-control">
          <label class="label pt-0"><span class="label-text font-medium text-white/80">Email</span></label>
          <label
            class="input input-bordered bg-base-300/50 border-white/10 flex items-center gap-3 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all rounded-xl h-12">
            <span class="icon-[mdi--email] text-base-content/50 text-lg"></span>
            <input type="text" name="username" [(ngModel)]="username"
              class="grow bg-transparent border-0 focus:ring-0 text-white" placeholder="admin" required />
          </label>
        </div>
        <div class="form-control">
          <label class="label pt-0">
            <span class="label-text font-medium text-white/80">Password</span>
          </label>
          <label
            class="input input-bordered bg-base-300/50 border-white/10 flex items-center gap-3 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all rounded-xl h-12">
            <span class="icon-[mdi--lock] text-base-content/50 text-lg"></span>
            <input type="password" name="password" [(ngModel)]="password"
              class="grow bg-transparent border-0 focus:ring-0 text-white" placeholder="••••••••" required />
          </label>
        </div>
        <button type="submit" [disabled]="isLoading()"
          class="btn btn-primary w-full mt-2 rounded-xl h-12 text-lg border-0">
          @if (isLoading()) {
          <span class="loading loading-spinner loading-sm"></span>
          }
          {{ isLoading() ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
