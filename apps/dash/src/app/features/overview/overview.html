<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
  <div class="flex flex-col items-start">
    <p class="text-primary font-medium text-sm tracking-widest uppercase mb-1">{{ date() }}</p>
    <h1 class="text-3xl lg:text-5xl font-black tracking-tight text-white  mb-4">
      {{ greeting() }}, Boss.
    </h1>

  </div>

  <button routerLink="/projects" [queryParams]="{ action: 'new' }" class="btn btn-primary">
    <span class="icon-[mdi--plus]"></span> New Project
  </button>
</div>

<div class="mt-8">

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (stat of statCards(); track stat.title) {
    <stat-card [title]="stat.title" [value]="stat.value" [link]="stat.link"></stat-card>
    }
  </div>

  <div class="mt-16">
    <h2 class="text-[#94A3B8] text-sm font-semibold tracking-[0.05em] mb-6">Quick Actions</h2>
    <div class="flex flex-wrap gap-4">
      @for (action of quickActions; track action.title) {
      <quick-action [title]="action.title" [icon]="action.icon" [link]="action.link"
        [queryParams]="action.queryParams"></quick-action>
      }
    </div>
  </div>

</div>
